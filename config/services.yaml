# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.encryption_key: '%env(APP_ENCRYPTION_KEY)%'
    app.empty_string: ''
    app.default_base_url: 'http://127.0.0.1:8000'
    app.base_url: '%env(default:app.default_base_url:APP_BASE_URL)%'
    app.default_mailer_from: 'no-reply@gei-platform.invalid'
    app.mailer_from: '%env(default:app.default_mailer_from:MAILER_FROM)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your events, commands, etc.

    # Auto-registration enabled for App namespace - all controllers will be services automatically
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Dto/'
            - '../src/AssetMapper/'

    # Custom crypto service for encrypting/decrypting sensitive data (TOTP secrets, etc.)
    App\Service\CryptoService:
        arguments:
            $encryptionKey: '%app.encryption_key%'

    App\Service\WebPushService:
        arguments:
            $publicKey: '%env(default:app.empty_string:VAPID_PUBLIC_KEY)%'
            $privateKey: '%env(default:app.empty_string:VAPID_PRIVATE_KEY)%'
            $subject: '%env(default:app.empty_string:VAPID_SUBJECT)%'

    App\Service\AblyRealtimeService:
        arguments:
            $apiKey: '%env(default:app.empty_string:ABLY_API_KEY)%'

    App\Service\AlertAttachmentStorageService:
        arguments:
            $storageDirectory: '%kernel.project_dir%/var/alert-attachments'

    App\Service\ProfilePhotoStorageService:
        arguments:
            $storageDirectory: '%kernel.project_dir%/var/profile-photos'

    # Manual service registration for AlertFilterService
    App\Service\AlertFilterService:
        arguments:
            $entityManager: '@doctrine.orm.default_entity_manager'

    # Manual service registration for AlertAuditRepository
    App\Repository\AlertAuditRepository:
        arguments:
            $conn: '@doctrine.dbal.default_connection'
            $cache: '@cache.app'

    # Manual service registration for AuditService
    App\Service\AuditService:
        arguments:
            $auditRepo: '@App\Repository\AlertAuditRepository'
            $em: '@doctrine.orm.default_entity_manager'
            $cache: '@cache.app'
