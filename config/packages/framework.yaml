# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(default:app.empty_string:TRUSTED_PROXIES)%'
    trusted_headers: [x-forwarded-for, x-forwarded-proto, x-forwarded-port, x-forwarded-prefix]

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: 28800  # 8 heures maximum (conforme à l'affichage "Session 8h maximum")
        gc_maxlifetime: 28800   # Doit correspondre à cookie_lifetime pour éviter la perte de session
        storage_factory_id: 'session.storage.factory.native'
        save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'

when@prod:
    framework:
        session:
            cookie_secure: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
